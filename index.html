<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Typing Chat</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 28px 16px;
      font-family: Arial, sans-serif; background: #f3f5f9; color: #172033;
    }
    .app { width: min(720px, 100%); margin: 0 auto; }
    header { text-align: center; margin-bottom: 22px; }
    h1 { margin: 0 0 8px; font-size: 30px; }
    .sub { color: #697386; margin: 0; }
    .card {
      background: white; border: 1px solid #e3e8f0; border-radius: 16px;
      padding: 20px; box-shadow: 0 8px 28px rgba(20,35,60,.06);
    }
    .join { max-width: 430px; margin: 40px auto; }
    label { display: block; font-weight: 700; margin-bottom: 9px; }
    input, textarea {
      width: 100%; font: inherit; border: 1px solid #d7deea; border-radius: 10px;
      padding: 13px 14px; outline: none; background: #fff; color: #172033;
    }
    input:focus, textarea:focus { border-color: #536dfe; box-shadow: 0 0 0 3px #536dfe20; }
    button {
      border: 0; border-radius: 10px; padding: 13px 18px; cursor: pointer;
      background: #4257e8; color: white; font-weight: 700; font-size: 15px;
    }
    button:hover { background: #3045d3; }
    .join button { width: 100%; margin-top: 12px; }
    .error { color: #c0392b; font-size: 14px; margin-top: 12px; }
    .topline { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 16px; }
    .status { color: #16834a; font-size: 13px; }
    .user-list { display: flex; flex-direction: column; gap: 14px; }
    .user-card { border: 1px solid #e5e9f1; border-radius: 12px; padding: 14px; }
    .user-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 9px; gap: 10px; }
    .username { font-weight: 700; overflow-wrap: anywhere; }
    .you { font-size: 11px; color: #4257e8; background: #edf0ff; padding: 4px 7px; border-radius: 20px; margin-left: 6px; }
    textarea { min-height: 76px; resize: vertical; line-height: 1.45; }
    textarea[readonly] { background: #f8f9fc; color: #465168; }
    .empty { color: #7a8496; text-align: center; padding: 28px 10px; }
    .note { font-size: 12px; color: #7a8496; line-height: 1.5; margin: 16px 2px 0; }
    .hidden { display: none; }
    @media (max-width: 480px) { body { padding: 20px 12px; } .card { padding: 16px; } h1 { font-size: 26px; } }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>Live Typing Chat</h1>
      <p class="sub">Type freely. Everyone sees your text change instantly.</p>
    </header>

    <section id="joinPanel" class="card join">
      <label for="usernameInput">What is your username?</label>
      <input id="usernameInput" maxlength="24" placeholder="Enter username..." autocomplete="nickname" />
      <button id="joinButton">Join chat</button>
      <div id="joinError" class="error"></div>
    </section>

    <section id="chatPanel" class="card hidden">
      <div class="topline">
        <strong>People typing</strong>
        <span id="connectionStatus" class="status">Connecting…</span>
      </div>
      <div id="userList" class="user-list">
        <div class="empty">Waiting for people to join…</div>
      </div>
      <p class="note">Your text is shared as you type. Deleting text here deletes it from everyone’s view too. Closing the tab removes your entry.</p>
    </section>
  </main>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script>
    // 1) Create a Firebase project and Realtime Database.
    // 2) Paste your project's web-app config below.
    const firebaseConfig = {
      apiKey: "PASTE_API_KEY_HERE",
      authDomain: "PASTE_PROJECT_ID_HERE.firebaseapp.com",
      databaseURL: "PASTE_DATABASE_URL_HERE",
      projectId: "PASTE_PROJECT_ID_HERE",
      appId: "PASTE_APP_ID_HERE"
    };

    const joinPanel = document.getElementById("joinPanel");
    const chatPanel = document.getElementById("chatPanel");
    const usernameInput = document.getElementById("usernameInput");
    const joinButton = document.getElementById("joinButton");
    const joinError = document.getElementById("joinError");
    const userList = document.getElementById("userList");
    const connectionStatus = document.getElementById("connectionStatus");

    let database, myRef, usersRef, connectedRef, myId;
    let updateTimer;

    function configIsReady() {
      return !Object.values(firebaseConfig).some(value =>
        String(value).includes("PASTE_")
      );
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[char]);
    }

    function renderUsers(snapshot) {
      const users = [];
      snapshot.forEach(child => users.push({ id: child.key, ...child.val() }));
      if (!users.length) {
        userList.innerHTML = '<div class="empty">Waiting for people to join…</div>';
        return;
      }

      userList.innerHTML = "";
      users.forEach(user => {
        const isMe = user.id === myId;
        const wrapper = document.createElement("div");
        wrapper.className = "user-card";

        const head = document.createElement("div");
        head.className = "user-head";
        const name = document.createElement("div");
        name.className = "username";
        name.textContent = user.username || "Guest";
        if (isMe) {
          const badge = document.createElement("span");
          badge.className = "you";
          badge.textContent = "YOU";
          name.appendChild(badge);
        }
        head.appendChild(name);

        const text = document.createElement("textarea");
        text.value = user.text || "";
        text.placeholder = isMe ? "Start typing here…" : "This user hasn't typed anything yet…";
        text.readOnly = !isMe;
        text.setAttribute("aria-label", isMe ? "Your live message" : user.username + "'s live message");

        if (isMe) {
          text.addEventListener("input", () => {
            clearTimeout(updateTimer);
            const latestText = text.value;
            updateTimer = setTimeout(() => {
              if (myRef) myRef.update({ text: latestText, updatedAt: Date.now() });
            }, 70);
          });
          // Keep focus and cursor stable when remote users update.
          window.myTextarea = text;
        }

        wrapper.appendChild(head);
        wrapper.appendChild(text);
        userList.appendChild(wrapper);
      });
    }

    async function joinChat() {
      const username = usernameInput.value.trim();
      if (!username) {
        joinError.textContent = "Please enter a username.";
        return;
      }
      if (!configIsReady()) {
        joinError.textContent = "Firebase setup is needed first. Follow the setup instructions below the app file.";
        return;
      }
      joinButton.disabled = true;
      joinError.textContent = "";

      try {
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        database = firebase.database();
        myId = database.ref("liveChat/users").push().key;
        usersRef = database.ref("liveChat/users");
        myRef = usersRef.child(myId);

        await myRef.set({
          username: username.slice(0, 24),
          text: "",
          joinedAt: firebase.database.ServerValue.TIMESTAMP,
          updatedAt: Date.now()
        });

        // Automatically remove this user's entry when their connection closes.
        connectedRef = database.ref(".info/connected");
        connectedRef.on("value", snapshot => {
          if (snapshot.val() === true) {
            myRef.onDisconnect().remove();
            connectionStatus.textContent = "Connected";
          } else {
            connectionStatus.textContent = "Reconnecting…";
          }
        });

        usersRef.on("value", renderUsers);
        joinPanel.classList.add("hidden");
        chatPanel.classList.remove("hidden");
      } catch (error) {
        console.error(error);
        joinError.textContent = "Could not connect. Check your Firebase config and database rules.";
        joinButton.disabled = false;
      }
    }

    joinButton.addEventListener("click", joinChat);
    usernameInput.addEventListener("keydown", event => {
      if (event.key === "Enter") joinChat();
    });
    window.addEventListener("beforeunload", () => {
      clearTimeout(updateTimer);
      if (myRef) myRef.remove();
    });
  </script>
</body>
</html>
